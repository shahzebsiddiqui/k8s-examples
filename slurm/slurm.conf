#
# slurm.conf — Slurm Workload Manager configuration
# Rocky Linux 9, Slurm 25.x, cgroup v2
#
# Place this file on ALL nodes of your cluster at /etc/slurm/slurm.conf
# Regenerate with the official configurator: https://slurm.schedmd.com/configurator.html
#

# ──────────────────────────────────────────────────────────────────────────────
# Cluster identity
# ──────────────────────────────────────────────────────────────────────────────

ClusterName=cluster

# Hostname of the controller node — change to match your actual controller
SlurmctldHost=k8s-controller

# ──────────────────────────────────────────────────────────────────────────────
# Authentication
# ──────────────────────────────────────────────────────────────────────────────

AuthType=auth/munge

# ──────────────────────────────────────────────────────────────────────────────
# Daemon PID files and ports
# ──────────────────────────────────────────────────────────────────────────────

SlurmctldPidFile=/var/run/slurmctld.pid
SlurmctldPort=6817
SlurmdPidFile=/var/run/slurmd.pid
SlurmdPort=6818

# ──────────────────────────────────────────────────────────────────────────────
# Paths
# ──────────────────────────────────────────────────────────────────────────────

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmUser=slurm

# ──────────────────────────────────────────────────────────────────────────────
# Process tracking and task management (cgroup v2 — Rocky 9 default)
# ──────────────────────────────────────────────────────────────────────────────

# cgroup/v2 is required on Rocky 9 (cgroup v1 is not available by default)
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity

# See cgroup.conf for cgroup v2 configuration (create /etc/slurm/cgroup.conf)

# ──────────────────────────────────────────────────────────────────────────────
# MPI
# ──────────────────────────────────────────────────────────────────────────────

MpiDefault=none
# MpiDefault=pmi2          # for OpenMPI / traditional MPI
# MpiDefault=pmix          # for PMIx-enabled MPI (recommended for modern stacks)

# ──────────────────────────────────────────────────────────────────────────────
# Scheduling
# ──────────────────────────────────────────────────────────────────────────────

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory   # allocate by core + memory

# ──────────────────────────────────────────────────────────────────────────────
# Timers
# ──────────────────────────────────────────────────────────────────────────────

InactiveLimit=0
KillWait=30
MinJobAge=300
SlurmctldTimeout=120
SlurmdTimeout=300
Waittime=0
ReturnToService=1

# ──────────────────────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────────────────────

SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log

# ──────────────────────────────────────────────────────────────────────────────
# Accounting (slurmdbd)
# ──────────────────────────────────────────────────────────────────────────────

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost     # host running slurmdbd
AccountingStoragePort=6819
AccountingStorageUser=slurm
# AccountingStorageEnforce=associations,limits,qos   # uncomment to enforce

JobCompType=jobcomp/none

# Gather per-job resource usage data (requires cgroup)
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=30

# ──────────────────────────────────────────────────────────────────────────────
# Switch
# ──────────────────────────────────────────────────────────────────────────────

SwitchType=switch/none

# ──────────────────────────────────────────────────────────────────────────────
# Compute nodes
# ──────────────────────────────────────────────────────────────────────────────
# Use `slurmd -C` on each node to get its exact hardware topology, then fill in:
#   NodeName=<host> Sockets=<N> CoresPerSocket=<N> ThreadsPerCore=<N> RealMemory=<MB>
#
# Example for a 2-CPU, 4GB node:
#   NodeName=k8s-controller Sockets=1 CoresPerSocket=2 ThreadsPerCore=1 RealMemory=3800 State=UNKNOWN

NodeName=k8s-controller Sockets=1 CoresPerSocket=2 ThreadsPerCore=1 RealMemory=3800 State=UNKNOWN

# ──────────────────────────────────────────────────────────────────────────────
# Partitions
# ──────────────────────────────────────────────────────────────────────────────

PartitionName=debug Nodes=ALL Default=YES MaxTime=INFINITE State=UP
