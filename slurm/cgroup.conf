#
# cgroup.conf — Slurm cgroup plugin configuration
# Rocky Linux 9 uses cgroup v2 by default — this file is REQUIRED.
#
# Place at /etc/slurm/cgroup.conf on ALL nodes.
# See: https://slurm.schedmd.com/cgroup.conf.html
#

# ──────────────────────────────────────────────────────────────────────────────
# cgroup version
# ──────────────────────────────────────────────────────────────────────────────

# Required for Rocky 9 — use cgroup v2 (unified hierarchy)
CgroupPlugin=autodetect         # autodetect picks v2 on Rocky 9; or set explicitly:
# CgroupPlugin=cgroup/v2

# ──────────────────────────────────────────────────────────────────────────────
# Resource constraining
# ──────────────────────────────────────────────────────────────────────────────

# Constrain RAM and swap per job (recommended)
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes

# Constrain CPUs to allocated cores only
ConstrainCores=yes

# Constrain devices (GPUs etc.) — enable if using GRES like GPUs
# ConstrainDevices=yes

# ──────────────────────────────────────────────────────────────────────────────
# Memory soft limit (optional — prevents OOM kills on slight overages)
# ──────────────────────────────────────────────────────────────────────────────

# AllowedRAMSpace=100           # % of allocated RAM allowed (100 = no overhead)
# AllowedSwapSpace=0            # disallow swap for jobs (strict)

# ──────────────────────────────────────────────────────────────────────────────
# systemd integration (cgroup v2 requires systemd slice delegation)
# ──────────────────────────────────────────────────────────────────────────────

# Slurm 23+ handles this automatically with cgroup/v2.
# Ensure slurmd runs with: systemd unit has Delegate=yes
# (the Slurm RPM's slurmd.service should include this — verify with:
#   systemctl cat slurmd | grep Delegate)
